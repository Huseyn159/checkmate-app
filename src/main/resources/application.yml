app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  base-url: ${APP_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    connect:
      country: ${STRIPE_CONNECT_COUNTRY:US}
    currency: ${STRIPE_CURRENCY:usd}
    platform-fee-percent: ${STRIPE_PLATFORM_FEE_PERCENT:10}
    azn-per-usd: ${AZN_PER_USD:1.70}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: checkmate
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:restaurant}?sslmode=${POSTGRES_SSLMODE:disable}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}